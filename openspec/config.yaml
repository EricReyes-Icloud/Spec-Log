# OpenSpec Configuration — spec-log
# Generated by sdd-init

schema: spec-driven

context: |
  Tech stack: Next.js 16.2.6, React 19.2.4, TypeScript 5.x (strict), Tailwind CSS v4
  Architecture: Modular (app/, components/email/, emails/templates/, lib/services/, styles/)
  Email: React Email + Resend
  Persistence: Supabase
  Hosting: Vercel

persistence:
  mode: openspec

testing:
  strict_tdd: true
  test_runner: vitest
  test_command: "npx vitest run"
  coverage: none
  notes: |
    vitest ^4.1.9 with jsdom env, @vitejs/plugin-react, @/* alias (vitest.config.ts).
    Testing libs: @testing-library/react, @testing-library/jest-dom, jsdom.
    3 existing test files under src/**/__tests__.
    Gap: no "test" script in package.json — use "npx vitest run" until one is added.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: true
    test_command: "npx vitest run"
  verify:
    test_command: "npx vitest run"
    build_command: "next build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas